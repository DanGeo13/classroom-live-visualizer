<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Classroom Live Visualizer</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #15151a;
      --accent: #3ddc97;
      --tech-color: #ff6b6b;
      --tool: #5aa9ff;
      --measure: #ffb84d;
      --text: #f2f2f5;
      --muted: #8a8a94;
      --ai: #c792ea;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--panel);
      border-bottom: 1px solid #232329;
      z-index: 20;
      flex-wrap: wrap;
      gap: 8px;
    }
    #topbar h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
    }
    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444;
      display: inline-block;
      margin-right: 8px;
      transition: background 0.3s;
    }
    #status-dot.live {
      background: #ff4757;
      box-shadow: 0 0 8px #ff4757;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, select, input[type="text"] {
      background: #1f1f26;
      color: var(--text);
      border: 1px solid #33333c;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover { background: #2a2a33; }
    button.active {
      background: var(--accent);
      color: #05130c;
      border-color: var(--accent);
    }
    button#finishBtn {
      background: var(--tech-color);
      color: #fff;
      font-weight: 600;
      border-color: var(--tech-color);
    }
    button#finishBtn:hover { background: #ff8787; }
    button#overheadBtn.active {
      background: #ffb84d;
      color: #211200;
      border-color: #ffb84d;
    }
    button#newSessionBtn { background: #2a2a33; }
    #titleInput { width: 190px; }
    #overheadSelect { display: none; }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1f1f26;
      border: 1px solid #33333c;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-wrap input { cursor: pointer; }
    .toggle-wrap.on { border-color: var(--accent); }
    #aiWrap.on { border-color: var(--ai); }
    #layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    #mainCol {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stageCanvas {
      width: 100%;
      height: 100%;
      background: #000;
    }
    video, #overheadVideo {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    #rightCol {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid #232329;
    }
    #focusHeader {
      padding: 12px 14px 6px;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid #1f1f26;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #focusHeader b { color: var(--text); }
    #aiStatus {
      font-size: 11px;
      color: var(--ai);
      display: none;
      align-items: center;
      gap: 4px;
    }
    #aiStatus .aidot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ai);
      animation: pulse 1.2s infinite;
    }
    #sidepanel {
      flex: 1;
      min-height: 0;
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pdot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f26;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 6px;
      font-size: 13px;
      transition: background 0.4s ease;
    }
    .chip.pulse { background: #2a3f36; }
    .chip.ai-pulse { background: #2e2540; }
    .chip .time {
      color: var(--muted);
      font-size: 11px;
      margin-left: 8px;
      white-space: nowrap;
    }
    .tool { border-left: 3px solid var(--tool); }
    .measure { border-left: 3px solid var(--measure); }
    .tech { border-left: 3px solid var(--tech-color); }
    .empty {
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
    }
    #overheadBox {
      display: none;
      flex-shrink: 0;
      border-top: 1px solid #232329;
      padding: 10px 14px 14px;
    }
    #overheadBox h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #ffb84d;
      margin: 0 0 8px 0;
    }
    #overheadCanvas {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #ffb84d;
      border-radius: 6px;
      display: block;
    }
    #freeze-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255,107,107,0.9);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 15;
    }
    #zoom-indicator {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,0.6);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      z-index: 15;
    }
    #flip-indicator {
      position: absolute;
      top: 50px;
      right: 14px;
      background: rgba(0,0,0,0.6);
      color: var(--tech-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      z-index: 15;
    }
    #mode-indicator {
      position: absolute;
      bottom: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      z-index: 15;
    }
    #mode-indicator .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s infinite;
    }
    #export-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #export-box {
      background: var(--panel);
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      min-width: 320px;
      border: 1px solid #2a2a33;
    }
    #export-box h2 { margin-top: 0; font-size: 18px; }
    #export-status {
      color: var(--muted);
      font-size: 14px;
      margin: 10px 0;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #2a2a33;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 12px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #export-links a {
      color: var(--accent);
      display: block;
      margin-top: 8px;
      text-decoration: none;
      font-weight: 500;
    }
    #export-links a:hover { text-decoration: underline; }
    #closeExport { margin-top: 16px; }
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1><span id="status-dot"></span>Classroom Live Visualizer</h1>
    <div id="controls">
      <input type="text" id="titleInput" placeholder="Demo title / focus skill">
      <select id="domainSelect" title="Subject domain">
        <option value="cooking">Cooking</option>
        <option value="timber">Timber Technology</option>
        <option value="textiles">Textiles & Sewing</option>
      </select>
      <label class="toggle-wrap on" id="recordWrap"><input type="checkbox" id="recordToggle" checked> Record</label>
      <label class="toggle-wrap on" id="transcribeWrap"><input type="checkbox" id="transcribeToggle" checked> Transcribe</label>
      <label class="toggle-wrap on" id="aiWrap"><input type="checkbox" id="aiToggle" checked> AI Classify</label>
      <select id="cameraSelect" title="Main Camera"></select>
      <button id="overheadBtn" title="Toggle Overhead Camera">Add Overhead Feed</button>
      <select id="overheadSelect" title="Select Overhead Camera"></select>
      <button id="mirrorBtn" title="Mirror horizontally [M]">Mirror</button>
      <button id="flipBtn" title="Flip 180 [F]">Flip 180</button>
      <button id="freezeBtn" title="Freeze frame [Space]">Freeze</button>
      <button id="resetZoomBtn" title="Reset Zoom">Reset Zoom</button>
      <button id="newSessionBtn" title="Clear demonstration memory">New Session</button>
      <button id="finishBtn">Finish & Save Demo</button>
    </div>
  </div>

  <div id="layout">
    <div id="mainCol">
      <video id="video" autoplay playsinline muted></video>
      <video id="overheadVideo" autoplay playsinline muted></video>
      <canvas id="stageCanvas"></canvas>
      <div id="freeze-overlay">FROZEN (Space to resume)</div>
      <div id="zoom-indicator">Zoomed 2.5x</div>
      <div id="flip-indicator">Flipped 180°</div>
      <div id="mode-indicator"><span class="dot"></span><span id="modeText">Ready</span></div>
    </div>

    <div id="rightCol">
      <div id="focusHeader">
        <span>Focus: <b id="focusLabel">Untitled</b></span>
        <span id="aiStatus"><span class="aidot"></span>AI refining</span>
      </div>
      <div id="sidepanel">
        <div class="panel-section">
          <h3><span class="pdot" style="background:var(--tool)"></span><span id="secTitleTools">Kitchen Tools</span></h3>
          <div id="toolList"><div class="empty">None detected yet</div></div>
        </div>
        <div class="panel-section">
          <h3><span class="pdot" style="background:var(--measure)"></span><span id="secTitleItems">Ingredients & Quantities</span></h3>
          <div id="measureList"><div class="empty">None detected yet</div></div>
        </div>
        <div class="panel-section">
          <h3><span class="pdot" style="background:var(--tech-color)"></span>Techniques & Safety</h3>
          <div id="techList"><div class="empty">None detected yet</div></div>
        </div>
      </div>
      <div id="overheadBox">
        <h3>Overhead Feed</h3>
        <canvas id="overheadCanvas"></canvas>
      </div>
    </div>
  </div>
</div>

<div id="export-overlay">
  <div id="export-box">
    <h2>Saving Demonstration</h2>
    <div class="spinner" id="spinner"></div>
    <div id="export-status">Preparing upload...</div>
    <div id="export-links"></div>
    <button id="closeExport" style="display:none">Close</button>
  </div>
</div>

<!-- Lexicon Dictionaries for Real-Time Offline Fallback -->

  "tools": ["tape measure","steel rule","try square","combination square","marking gauge","marking knife","pencil","handsaw","tenon saw","coping saw","chisel","bench plane","block plane","file","rasp","mallet","claw hammer","screwdriver","g-clamp","f-clamp","bar clamp","vice","cordless drill","drop saw","bandsaw","drill press","sandpaper"],

{
  "tools": ["dressmaking shears","fabric scissors","snips","rotary cutter","cutting mat","seam ripper","tape measure","tailor's chalk","hand sewing needle","pins","iron","ironing board","tailor's ham","sewing machine","overlocker","bobbin","presser foot"],
  "materials": ["cotton","calico","muslin","denim","linen","wool","felt","silk","polyester","interfacing","batting","thread","button","zipper","velcro","elastic","bias tape"],
  "descriptors": ["folded","cut on fold","bias cut","pinned","basted","staystitched","interfaced","pressed open","gathered","hemmed","topstitched"]

<script>
  // Updated Deployment URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYeGyzS1xgqtwEVDSFschn5f94l5OoeearDXgY9u_ccfGclh0f7K1EamSmBhVV6fUXhQ/exec";
  const AI_BATCH_INTERVAL_MS = 10000;

  const DICTS = {
    cooking: JSON.parse(document.getElementById('dict-cooking').textContent),
    timber: JSON.parse(document.getElementById('dict-timber').textContent),
    textiles: JSON.parse(document.getElementById('dict-textiles').textContent)
  };

  const MEASUREMENT_REGEX = /(?:\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+)\s*(?:x\s*)?(?:g|kg|grams?|kilos?|kilograms?|mg|ml|mL|l|L|litres?|cups?|tbsp|tsp|teaspoons?|tablespoons?|degrees?|°[CF]?|mm|cm|m|metres?|inches?|pinch|dash|handful)/gi;
  const COUNT_PREFIX_REGEX = /^(?:\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+)\s*(?:x\s*)?(?:a|one|two|three|four|five|six|seven|eight|nine|ten|half\s*a|a\s*pair\s*of|a\s*handful\s*of|a\s*pinch\s*of)/i;

  const STEP_PATTERNS = [/\bfirst\b/i, /\bnext\b/i, /\bthen\b/i, /\bafter that\b/i, /\bnow we\b/i, /\bstep\b/i, /\bfinally\b/i, /\blet'?s (?:start|begin|move on)\b/i];
  const TECHNIQUE_PATTERNS = [/\btechnique\b/i, /\bmake sure to\b/i, /\bnotice how\b/i, /\bhold the blade\b/i, /\bensure the temperature\b/i, /\bbe careful\b/i, /\bsafety tip\b/i, /\bkey is\b/i, /\bwatch your fingers\b/i, /\balways\b/i];

  let currentDomain = "cooking";
  let mainStream = null, overheadStream = null, overheadActive = false;
  let mediaRecorder = null, recordedChunks = [];
  let recordingEnabled = true, transcriptionEnabled = true, aiClassifyEnabled = true;
  let currentZoom = 1, zoomOriginX = 0.5, zoomOriginY = 0.5;
  let mirrored = false, flipped = false, frozen = false;
  let recognizer = null, sessionStartTime = null;
  let transcriptLog = [];
  let pendingAiLines = [];
  let aiBatchTimer = null;
  let isAiBatchRunning = false;
  let speechErrorCooldown = false;
  let displayRafId = null, recordRafId = null, overheadRafId = null;
  let thumbnailBase64 = null;

  const toolRegistry = new Map();
  const itemRegistry = new Map();
  const techRegistry = new Map();

  const mainVideo = document.getElementById('video');
  const overheadVideo = document.getElementById('overheadVideo');
  const displayCanvas = document.getElementById('stageCanvas');
  const displayCtx = displayCanvas.getContext('2d');
  const overheadCanvas = document.getElementById('overheadCanvas');
  const overheadCtx = overheadCanvas.getContext('2d');
  const mainCol = document.getElementById('mainCol');

  const recordCanvas = document.createElement('canvas');
  const recordCtx = recordCanvas.getContext('2d');
  recordCanvas.width = 1920;
  recordCanvas.height = 1080;

  const statusDot = document.getElementById('status-dot');
  const titleInput = document.getElementById('titleInput');
  const domainSelect = document.getElementById('domainSelect');
  const focusLabel = document.getElementById('focusLabel');
  const aiStatus = document.getElementById('aiStatus');
  const secTitleTools = document.getElementById('secTitleTools');
  const secTitleItems = document.getElementById('secTitleItems');
  const cameraSelect = document.getElementById('cameraSelect');
  const overheadBtn = document.getElementById('overheadBtn');
  const overheadSelect = document.getElementById('overheadSelect');
  const overheadBox = document.getElementById('overheadBox');
  const mirrorBtn = document.getElementById('mirrorBtn');
  const flipBtn = document.getElementById('flipBtn');
  const freezeBtn = document.getElementById('freezeBtn');
  const resetZoomBtn = document.getElementById('resetZoomBtn');
  const newSessionBtn = document.getElementById('newSessionBtn');
  const finishBtn = document.getElementById('finishBtn');

  const freezeOverlay = document.getElementById('freeze-overlay');
  const zoomIndicator = document.getElementById('zoom-indicator');
  const flipIndicator = document.getElementById('flip-indicator');
  const modeText = document.getElementById('modeText');

  const recordToggle = document.getElementById('recordToggle');
  const transcribeToggle = document.getElementById('transcribeToggle');
  const aiToggle = document.getElementById('aiToggle');
  const recordWrap = document.getElementById('recordWrap');
  const transcribeWrap = document.getElementById('transcribeWrap');
  const aiWrap = document.getElementById('aiWrap');

  const toolList = document.getElementById('toolList');
  const measureList = document.getElementById('measureList');
  const techList = document.getElementById('techList');

  const exportOverlay = document.getElementById('export-overlay');
  const exportStatus = document.getElementById('export-status');
  const exportLinks = document.getElementById('export-links');
  const spinner = document.getElementById('spinner');
  const closeExportBtn = document.getElementById('closeExport');

  function updateModeText() {
    const parts = [];
    if (recordingEnabled) parts.push("Recording");
    if (transcriptionEnabled) parts.push("Transcribing");
    if (transcriptionEnabled && aiClassifyEnabled) parts.push("AI Active");
    modeText.textContent = parts.length > 0 ? parts.join(" • ") : "Monitor Only";
  }

  function updateDomainLabels() {
    currentDomain = domainSelect.value;
    if (currentDomain === "cooking") {
      secTitleTools.textContent = "Kitchen Tools";
      secTitleItems.textContent = "Ingredients & Quantities";
    } else if (currentDomain === "timber") {
      secTitleTools.textContent = "Workshop Tools";
      secTitleItems.textContent = "Materials & Dimensions";
    } else if (currentDomain === "textiles") {
      secTitleTools.textContent = "Sewing & Fabric Tools";
      secTitleItems.textContent = "Fabrics & Notions";
    }
  }
  domainSelect.addEventListener('change', updateDomainLabels);

  titleInput.addEventListener('input', () => {
    const val = titleInput.value.trim();
    focusLabel.textContent = val.length > 0 ? val : "Untitled";
  });

  function classifySpeech(text) {
    for (const p of STEP_PATTERNS) if (p.test(text)) return "STEP";
    for (const p of TECHNIQUE_PATTERNS) if (p.test(text)) return "TECHNIQUE";
    return "SPEECH";
  }

  function elapsedTimeStr() {
    if (!sessionStartTime) return "00:00:00";
    const s = Math.floor((Date.now() - sessionStartTime) / 1000);
    const hh = String(Math.floor(s / 3600)).padStart(2, '0');
    const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    return `${hh}:${mm}:${ss}`;
  }

  function createChipElement(text, cssClass) {
    const chip = document.createElement('div');
    chip.className = 'chip ' + cssClass;
    const span = document.createElement('span');
    span.textContent = text;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = elapsedTimeStr();
    chip.appendChild(span);
    chip.appendChild(time);
    return chip;
  }

  function flashPulse(el, aiSourced) {
    const cls = aiSourced ? 'ai-pulse' : 'pulse';
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 600);
  }

  function upsertChip(registry, key, container, phrase, cssClass, aiSourced) {
    const normKey = key.toLowerCase().trim();
    if (registry.has(normKey)) {
      const entry = registry.get(normKey);
      entry.text = phrase;
      entry.el.querySelector('span').textContent = phrase;
      entry.el.querySelector('.time').textContent = elapsedTimeStr();
      flashPulse(entry.el, aiSourced);
    } else {
      if (container.querySelector('.empty')) container.innerHTML = '';
      const el = createChipElement(phrase, cssClass);
      container.appendChild(el);
      registry.set(normKey, { text: phrase, el: el });
      flashPulse(el, aiSourced);
    }
  }

  function rebuildListFromAiState(container, registry, items, cssClass) {
    container.innerHTML = '';
    registry.clear();
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="empty">None detected yet</div>';
      return;
    }
    items.forEach(text => {
      const el = createChipElement(text, cssClass);
      container.appendChild(el);
      flashPulse(el, true);
      registry.set(text.toLowerCase().trim(), { text: text, el: el });
    });
  }

  function findDictMatch(textLower, dictArray) {
    let longest = null;
    dictArray.forEach(term => {
      const re = new RegExp(`\\b${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
      if (re.test(textLower)) {
        if (!longest || term.length > longest.length) longest = term;
      }
    });
    return longest;
  }

  function findDescriptors(textLower, descriptorsArray) {
    const matches = [];
    descriptorsArray.forEach(d => {
      const re = new RegExp(`\\b${d.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
      if (re.test(textLower)) matches.push(d);
    });
    return matches;
  }

  function extractCategoriesLocal(text) {
    const lower = text.toLowerCase();
    const dict = DICTS[currentDomain] || DICTS.cooking;

    const matchedTool = findDictMatch(lower, dict.tools);
    if (matchedTool) {
      upsertChip(toolRegistry, matchedTool, toolList, matchedTool, 'tool', false);
    }

    const matchedMaterial = findDictMatch(lower, dict.materials);
    const measureMatches = text.match(MEASUREMENT_REGEX);
    const descriptors = findDescriptors(lower, dict.descriptors);

    if (matchedMaterial) {
      let fullPhrase = "";
      if (measureMatches && measureMatches.length > 0) {
        const qty = measureMatches[0].trim();
        const descStr = descriptors.length > 0 ? descriptors.join(' ') + ' ' : '';
        fullPhrase = `${qty} of ${descStr}${matchedMaterial}`;
      } else {
        const countMatch = lower.match(COUNT_PREFIX_REGEX);
        if (countMatch) {
          const countPrefix = countMatch[0].trim();
          const descStr = descriptors.length > 0 ? descriptors.join(' ') + ' ' : '';
          fullPhrase = `${countPrefix} ${descStr}${matchedMaterial}`;
        } else if (descriptors.length > 0) {
          fullPhrase = `${descriptors.join(' ')} ${matchedMaterial}`;
        } else {
          fullPhrase = matchedMaterial;
        }
      }
      upsertChip(itemRegistry, matchedMaterial, measureList, fullPhrase, 'measure', false);
    }
  }

  async function postApi(payload) {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error("HTTP error " + resp.status);
    return await resp.json();
  }

  async function runAiClassificationBatch() {
    if (!aiClassifyEnabled || pendingAiLines.length === 0 || isAiBatchRunning) return;
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("YOUR_") !== -1) return;

    isAiBatchRunning = true;
    const batch = pendingAiLines.slice();
    pendingAiLines = [];
    aiStatus.style.display = "flex";

    try {
      const result = await postApi({
        action: "classifyTranscript",
        lines: batch,
        domain: currentDomain
      });

      if (result.success) {
        rebuildListFromAiState(toolList, toolRegistry, result.tools, 'tool');
        rebuildListFromAiState(measureList, itemRegistry, result.ingredients, 'measure');
        rebuildListFromAiState(techList, techRegistry, result.techniques, 'tech');
      }
    } catch (err) {
      console.warn("AI batch update failed:", err.message);
    } finally {
      aiStatus.style.display = "none";
      isAiBatchRunning = false;
    }
  }

  async function hydrateFromPersistedState() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("YOUR_") !== -1) return;
    try {
      const result = await postApi({ action: "classifyTranscript", lines: [], domain: currentDomain });
      if (result.success) {
        rebuildListFromAiState(toolList, toolRegistry, result.tools, 'tool');
        rebuildListFromAiState(measureList, itemRegistry, result.ingredients, 'measure');
        rebuildListFromAiState(techList, techRegistry, result.techniques, 'tech');
      }
    } catch (err) {
      console.log("Could not hydrate from persisted state:", err.message);
    }
  }

  function startAiBatchTimer() {
    if (aiBatchTimer) return;
    aiBatchTimer = setInterval(runAiClassificationBatch, AI_BATCH_INTERVAL_MS);
  }

  function stopAiBatchTimer() {
    if (aiBatchTimer) {
      clearInterval(aiBatchTimer);
      aiBatchTimer = null;
    }
    pendingAiLines = [];
    aiStatus.style.display = "none";
  }

  async function resetPersistedState() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("YOUR_") !== -1) return;
    try {
      await postApi({ action: "resetSessionState" });
      rebuildListFromAiState(toolList, toolRegistry, [], 'tool');
      rebuildListFromAiState(measureList, itemRegistry, [], 'measure');
      rebuildListFromAiState(techList, techRegistry, [], 'tech');
    } catch (err) {
      console.error("Reset state error:", err.message);
    }
  }

  newSessionBtn.addEventListener('click', () => {
    if (confirm("Reset current session and clear Google Sheets persistent memory?")) {
      resetPersistedState();
    }
  });

  aiToggle.addEventListener('change', () => {
    aiClassifyEnabled = aiToggle.checked;
    aiWrap.classList.toggle('on', aiClassifyEnabled);
    if (aiClassifyEnabled) startAiBatchTimer();
    else stopAiBatchTimer();
    updateModeText();
  });

  function resizeCanvases() {
    const rect = mainCol.getBoundingClientRect();
    displayCanvas.width = rect.width;
    displayCanvas.height = rect.height;

    const obRect = overheadCanvas.getBoundingClientRect();
    overheadCanvas.width = obRect.width || 300;
    overheadCanvas.height = obRect.height || 169;
  }
  window.addEventListener('resize', resizeCanvases);

  function drawContain(targetCtx, videoEl, tx, ty, tw, th) {
    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
    if (!vw || !vh) return;
    const scale = Math.min(tw / vw, th / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = tx + (tw - dw) / 2, dy = ty + (th - dh) / 2;
    targetCtx.drawImage(videoEl, dx, dy, dw, dh);
  }

  function drawMainFeed(targetCtx, x, y, w, h) {
    targetCtx.save();
    targetCtx.beginPath();
    targetCtx.rect(x, y, w, h);
    targetCtx.clip();
    targetCtx.fillStyle = '#000';
    targetCtx.fillRect(x, y, w, h);

    const originXpx = x + zoomOriginX * w;
    const originYpx = y + zoomOriginY * h;

    targetCtx.translate(originXpx, originYpx);
    if (flipped) targetCtx.rotate(Math.PI);
    if (mirrored) targetCtx.scale(-1, 1);
    targetCtx.scale(currentZoom, currentZoom);
    targetCtx.translate(-originXpx, -originYpx);

    drawContain(targetCtx, mainVideo, x, y, w, h);
    targetCtx.restore();
  }

  function renderDisplayFrame() {
    if (!frozen) drawMainFeed(displayCtx, 0, 0, displayCanvas.width, displayCanvas.height);
    displayRafId = requestAnimationFrame(renderDisplayFrame);
  }

  function renderOverheadFrame() {
    if (overheadActive && overheadVideo.videoWidth) {
      overheadCtx.fillStyle = '#000';
      overheadCtx.fillRect(0, 0, overheadCanvas.width, overheadCanvas.height);
      drawContain(overheadCtx, overheadVideo, 0, 0, overheadCanvas.width, overheadCanvas.height);
    }
    overheadRafId = requestAnimationFrame(renderOverheadFrame);
  }

  function renderRecordFrame() {
    if (!frozen) {
      recordCtx.fillStyle = '#000';
      recordCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);

      if (overheadActive && overheadVideo.videoWidth) {
        const mainW = recordCanvas.width * 0.72;
        const overheadW = recordCanvas.width - mainW;
        drawMainFeed(recordCtx, 0, 0, mainW, recordCanvas.height);

        recordCtx.save();
        recordCtx.fillStyle = '#000';
        recordCtx.fillRect(mainW, 0, overheadW, recordCanvas.height);
        drawContain(recordCtx, overheadVideo, mainW + 8, 8, overheadW - 16, recordCanvas.height - 16);
        recordCtx.strokeStyle = '#ffb84d';
        recordCtx.lineWidth = 4;
        recordCtx.strokeRect(mainW + 4, 4, overheadW - 8, recordCanvas.height - 8);
        recordCtx.restore();
      } else {
        drawMainFeed(recordCtx, 0, 0, recordCanvas.width, recordCanvas.height);
      }
    }
    recordRafId = requestAnimationFrame(renderRecordFrame);
  }

  function startRecorder() {
    const canvasStream = recordCanvas.captureStream(30);
    const audioTrack = mainStream ? mainStream.getAudioTracks()[0] : null;
    if (audioTrack) canvasStream.addTrack(audioTrack);

    let mimeType = 'video/webm;codecs=vp9,opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

    try {
      mediaRecorder = new MediaRecorder(canvasStream, { mimeType });
    } catch (e) {
      mediaRecorder = new MediaRecorder(canvasStream);
    }

    recordedChunks = [];
    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.start(1000);
    if (!sessionStartTime) sessionStartTime = Date.now();
  }

  function stopRecorderSilently() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.onstop = null;
      try { mediaRecorder.stop(); } catch (e) {}
    }
    mediaRecorder = null;
    recordedChunks = [];
  }

  recordToggle.addEventListener('change', () => {
    recordingEnabled = recordToggle.checked;
    recordWrap.classList.toggle('on', recordingEnabled);
    if (recordingEnabled) {
      if (!mediaRecorder && mainStream) startRecorder();
    } else {
      stopRecorderSilently();
    }
    updateModeText();
  });

  transcribeToggle.addEventListener('change', () => {
    transcriptionEnabled = transcribeToggle.checked;
    transcribeWrap.classList.toggle('on', transcriptionEnabled);
    if (transcriptionEnabled) {
      if (!recognizer) initSpeech();
      else try { recognizer.start(); } catch (e) {}
      if (aiClassifyEnabled) startAiBatchTimer();
    } else {
      if (recognizer) try { recognizer.stop(); } catch (e) {}
      stopAiBatchTimer();
    }
    updateModeText();
  });

  async function initMainMedia(deviceId) {
    if (mainStream) mainStream.getTracks().forEach(t => t.stop());

    const constraints = {
      video: deviceId ? { exact: deviceId } : { ideal: 1920 },
      audio: true
    };

    mainStream = await navigator.mediaDevices.getUserMedia(constraints);
    mainVideo.srcObject = mainStream;
    statusDot.classList.add('live');

    if (!displayRafId) {
      resizeCanvases();
      renderDisplayFrame();
      renderRecordFrame();
      renderOverheadFrame();
    }

    if (recordingEnabled && !mediaRecorder) startRecorder();
    if (transcriptionEnabled && !recognizer) initSpeech();
    if (transcriptionEnabled && aiClassifyEnabled) startAiBatchTimer();
    updateModeText();
  }

  async function enumerateCameras() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');

    [cameraSelect, overheadSelect].forEach(sel => {
      const isOverhead = (sel.id === 'overheadSelect');
      sel.innerHTML = isOverhead ? '<option value="">Choose overhead camera...</option>' : '';
      videoDevices.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${i + 1}`;
        sel.appendChild(opt);
      });
    });
  }

  cameraSelect.addEventListener('change', async (e) => {
    try { await initMainMedia(e.target.value); } catch (err) { console.error("Camera switch error:", err); }
  });

  overheadBtn.addEventListener('click', () => {
    if (!overheadActive) {
      overheadSelect.style.display = 'inline-block';
    } else {
      stopOverhead();
    }
  });

  overheadSelect.addEventListener('change', async (e) => {
    const deviceId = e.target.value;
    if (!deviceId) return;

    try {
      overheadStream = await navigator.mediaDevices.getUserMedia({
        video: { exact: deviceId },
        audio: false
      });
      overheadVideo.srcObject = overheadStream;
      overheadActive = true;
      overheadBtn.textContent = 'Remove Overhead Feed';
      overheadBtn.classList.add('active');
      overheadBox.style.display = 'block';
      overheadSelect.style.display = 'none';
      resizeCanvases();
    } catch (err) {
      console.error("Overhead camera activation failed:", err);
    }
  });

  function stopOverhead() {
    if (overheadStream) {
      overheadStream.getTracks().forEach(t => t.stop());
      overheadStream = null;
    }
    overheadActive = false;
    overheadBtn.textContent = 'Add Overhead Feed';
    overheadBtn.classList.remove('active');
    overheadBox.style.display = 'none';
    overheadSelect.style.display = 'none';
    overheadSelect.value = '';
    resizeCanvases();
  }

  displayCanvas.addEventListener('dblclick', (e) => {
    const rect = displayCanvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    if (currentZoom === 1) {
      zoomOriginX = x;
      zoomOriginY = y;
      currentZoom = 2.5;
      zoomIndicator.style.display = 'block';
    } else {
      currentZoom = 1;
      zoomOriginX = 0.5;
      zoomOriginY = 0.5;
      zoomIndicator.style.display = 'none';
    }
  });

  resetZoomBtn.addEventListener('click', () => {
    currentZoom = 1;
    zoomOriginX = 0.5;
    zoomOriginY = 0.5;
    zoomIndicator.style.display = 'none';
  });

  function toggleMirror() {
    mirrored = !mirrored;
    mirrorBtn.classList.toggle('active', mirrored);
  }
  mirrorBtn.addEventListener('click', toggleMirror);

  function toggleFlip() {
    flipped = !flipped;
    flipBtn.classList.toggle('active', flipped);
    flipIndicator.style.display = flipped ? 'block' : 'none';
  }
  flipBtn.addEventListener('click', toggleFlip);

  function toggleFreeze() {
    frozen = !frozen;
    freezeBtn.classList.toggle('active', frozen);
    freezeOverlay.style.display = frozen ? 'block' : 'none';
  }
  freezeBtn.addEventListener('click', toggleFreeze);

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); toggleFreeze(); }
    if (e.key.toLowerCase() === 'm') toggleMirror();
    if (e.key.toLowerCase() === 'f') toggleFlip();
  });

  function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    if (recognizer) {
      try { recognizer.abort(); } catch (e) {}
      recognizer = null;
    }

    recognizer = new SpeechRecognition();
    recognizer.continuous = true;
    recognizer.interimResults = true;
    recognizer.lang = 'en-AU';

    recognizer.onresult = (event) => {
      speechErrorCooldown = false;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        const text = result[0].transcript.trim();
        if (result.isFinal && text.length > 0) {
          const type = classifySpeech(text);
          const entry = { time: elapsedTimeStr(), type: type, text: text };
          transcriptLog.push(entry);
          extractCategoriesLocal(text);
          if (aiClassifyEnabled) pendingAiLines.push(entry);
        }
      }
    };

    recognizer.onerror = (e) => {
      console.warn("Speech API error:", e.error);
      if (e.error === 'audio-capture' || e.error === 'not-allowed') {
        speechErrorCooldown = true;
      }
    };

    recognizer.onend = () => {
      if (speechErrorCooldown) {
        setTimeout(() => {
          speechErrorCooldown = false;
          if (mainStream && transcriptionEnabled) {
            try { recognizer.start(); } catch (err) {}
          }
        }, 3000);
        return;
      }

      if (mainStream && transcriptionEnabled) {
        setTimeout(() => {
          try { recognizer.start(); } catch (err) {}
        }, 500);
      }
    };

    // Stagger SpeechRecognition startup to allow getUserMedia to claim hardware
    setTimeout(() => {
      try { recognizer.start(); } catch (e) {
        console.warn("SpeechRecognition start delay error:", e.message);
      }
    }, 600);
  }

  async function uploadPayload(base64Video, durationSeconds, sessionTitle, mimeType) {
    exportStatus.textContent = "Uploading package to Google Drive...";
    try {
      const result = await postApi({
        action: "saveDemonstrationPackage",
        base64Video: base64Video,
        transcriptLog: transcriptLog,
        sessionTitle: sessionTitle,
        thumbnailBase64: thumbnailBase64,
        meta: { durationSeconds: durationSeconds, mimeType: mimeType || 'video/webm' }
      });
      onSaveSuccess(result);
    } catch (err) {
      onSaveFailure(err);
    }
  }

  finishBtn.addEventListener('click', async () => {
    exportOverlay.style.display = 'flex';
    exportStatus.textContent = "Finalizing session...";
    spinner.style.display = 'block';
    closeExportBtn.style.display = 'none';
    exportLinks.innerHTML = '';

    if (recognizer) try { recognizer.stop(); } catch (e) {}
    stopAiBatchTimer();

    if (pendingAiLines.length > 0) {
      await runAiClassificationBatch();
    }

    try {
      const snapshotSource = (mediaRecorder && mediaRecorder.state === 'recording') ? recordCanvas : displayCanvas;
      thumbnailBase64 = snapshotSource.toDataURL('image/png');
    } catch (e) {
      thumbnailBase64 = null;
    }

    const durationSeconds = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 1000) : 0;
    const sessionTitle = titleInput.value.trim();

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      const recorderRef = mediaRecorder;
      recorderRef.onstop = async () => {
        exportStatus.textContent = "Encoding video file...";
        const blob = new Blob(recordedChunks, { type: recorderRef.mimeType || 'video/webm' });
        const reader = new FileReader();
        reader.onload = async function() {
          await uploadPayload(reader.result, durationSeconds, sessionTitle, recorderRef.mimeType || 'video/webm');
        };
        reader.readAsDataURL(blob);
      };
      recorderRef.stop();
      mediaRecorder = null;
    } else if (transcriptLog.length > 0) {
      await uploadPayload(null, durationSeconds, sessionTitle, null);
    } else {
      exportStatus.textContent = "No demonstration content to export yet.";
      spinner.style.display = 'none';
      closeExportBtn.style.display = 'inline-block';
    }
  });

  function onSaveSuccess(result) {
    spinner.style.display = 'none';
    if (result.success) {
      exportStatus.textContent = "Saved to Google Drive!";
      const videoLink = result.videoUrl ? `<a href="${result.videoUrl}" target="_blank">🎬 Open Saved Video</a>` : '';
      exportLinks.innerHTML = `${videoLink}<a href="${result.docUrl}" target="_blank">📄 Open Demonstration & Rubric Doc</a>`;
    } else {
      exportStatus.textContent = "Export error: " + result.message;
    }
    closeExportBtn.style.display = 'inline-block';
  }

  function onSaveFailure(err) {
    spinner.style.display = 'none';
    exportStatus.textContent = "Upload failed: " + err.message + ". Check your Web App deployment.";
    closeExportBtn.style.display = 'inline-block';
  }

  closeExportBtn.addEventListener('click', () => {
    exportOverlay.style.display = 'none';
  });

  async function boot() {
    try {
      resizeCanvases();
      updateDomainLabels();
      await initMainMedia(null);
      await enumerateCameras();
      await hydrateFromPersistedState();
      updateModeText();
    } catch (err) {
      console.warn("Camera/Mic initial access error:", err.message);
    }
  }

  boot();
</script>
</body>
</html>
